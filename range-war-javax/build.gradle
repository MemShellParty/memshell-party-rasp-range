plugins {
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

dependencies {
    implementation project(':range-core')
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    // The SDK resolves Jetty Handler/Customizer templates through the webapp
    // classloader, which hides org.eclipse.jetty.* from Jetty's parent loader.
    // Bundling the Jetty API lets those templates resolve inside the WAR.
    runtimeOnly 'org.eclipse.jetty:jetty-server:9.4.19.v20190610'
    // Some containers relocate org.apache.catalina.* into their own package,
    // but the SDK Valve template still extends org.apache.catalina.Valve, so
    // the generator needs that type inside the webapp loader. Tomcat delegates
    // the package to its own catalina.jar, so the stub does not shadow it there.
    runtimeOnly "io.github.reajason:memshell-party-stub-tomcat:3.0.0"
}

war {
    archiveBaseName = 'range-war-javax'
    from("$rootDir/web-static/static") {
        into '/'
    }
}
