plugins {
    id 'war'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

dependencies {
    implementation project(':range-core')
    providedCompile 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    // The SDK Valve template extends org.apache.catalina.Valve; keep that type
    // inside the webapp loader so the generator can resolve it. Tomcat's loader
    // delegates the package to catalina.jar, so the stub does not shadow it.
    runtimeOnly "io.github.reajason:memshell-party-stub-tomcat:3.0.0"
}

war {
    archiveBaseName = 'range-war-jakarta'
    from("$rootDir/web-static/static") {
        into '/'
    }
}
