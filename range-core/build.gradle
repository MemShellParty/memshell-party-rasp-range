plugins {
    id 'java-library'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

dependencies {
    api "io.github.reajason:memshell-party-core:3.1.0"
    api "io.github.reajason:memshell-party-api:3.1.0"
    api "io.github.reajason:memshell-party-packer:3.1.0"
    api("io.github.reajason:memshell-party-server-servlet:3.1.0") {
        // Signature stubs must not shadow the real container classes in the range artifact.
        exclude group: 'io.github.reajason', module: 'memshell-party-stub-tomcat'
        exclude group: 'io.github.reajason', module: 'memshell-party-stub-jetty'
    }
    api "io.github.reajason:memshell-party-server-spring-webmvc:3.0.0"
    api "io.github.reajason:memshell-party-server-spring-webflux:3.0.0"
    api "io.github.reajason:memshell-party-shelltool-godzilla:3.0.0"
    api "io.github.reajason:memshell-party-shelltool-behinder:3.0.0"
    api "io.github.reajason:memshell-party-shelltool-command:3.1.0"
    api "io.github.reajason:memshell-party-shelltool-suo5:3.0.0"
    api "io.github.reajason:memshell-party-shelltool-antsword:3.0.0"
    api "io.github.reajason:memshell-party-shelltool-neoregeorg:3.0.0"
    api "io.github.reajason:memshell-party-shelltool-proxy:3.0.0"

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
}
